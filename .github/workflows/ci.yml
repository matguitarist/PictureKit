name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build (PictureKit and PictureKitUI)
        run: swift build
      - name: Tests
        run: swift test
      - name: Build for iOS
        run: xcodebuild -scheme PictureKit-Package -destination 'generic/platform=iOS' -quiet build
